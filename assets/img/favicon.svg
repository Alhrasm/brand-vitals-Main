<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Brand Vitals tab icon: the logo's heartbeat pulse in its cyan-to-green gradient -->
  <defs>
    <linearGradient id="bvTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1A23"/>
      <stop offset="1" stop-color="#05080B"/>
    </linearGradient>
    <linearGradient id="bvPulse" x1="7" y1="0" x2="57" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00AAFF"/>
      <stop offset="1" stop-color="#07E4A1"/>
    </linearGradient>
    <radialGradient id="bvGlow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#00AAFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00AAFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bvTile)"/>
